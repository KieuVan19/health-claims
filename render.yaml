services:
  - type: web
    name: health-claims-api
    env: node
    buildCommand: pnpm install && cd backend && sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npx prisma generate && pnpm build
    startCommand: cd backend && npx prisma migrate resolve --rolled-back 20260525150803_init 2>/dev/null || true && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: GRAFANA_LOKI_URL
        value: https://logs-prod-020.grafana.net
      - key: GRAFANA_LOKI_USER
        value: "1691557"
      - key: GRAFANA_LOKI_PASSWORD
        sync: false
