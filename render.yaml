services:
  - type: web
    name: health-claims-api
    env: node
    buildCommand: pnpm install && cd backend && npx prisma generate && pnpm build
    startCommand: cd backend && npx prisma migrate resolve --rolled-back 20260525150803_init 2>/dev/null || true && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 10485760
